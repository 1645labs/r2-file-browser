<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>R2 Drive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%234285f4' d='M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8l-2-2z'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <!-- Login gate -->
    <div id="login" class="login hidden">
      <form id="login-form" class="login-card">
        <div class="login-logo">☁️</div>
        <h1>R2 Drive</h1>
        <p>Enter the access password to continue.</p>
        <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" />
        <button type="submit">Unlock</button>
        <div id="login-error" class="login-error"></div>
      </form>
    </div>

    <!-- App -->
    <div id="app" class="app hidden">
      <header class="topbar">
        <div class="brand">
          <span class="brand-logo">☁️</span>
          <span class="brand-name">R2 Drive</span>
        </div>
        <div class="topbar-actions">
          <button id="btn-new-folder" class="btn ghost" title="New folder">
            <span class="ico">📁</span> New folder
          </button>
          <button id="btn-upload" class="btn primary" title="Upload files">
            <span class="ico">⬆</span> Upload
          </button>
          <input type="file" id="file-input" multiple hidden />
          <button id="btn-logout" class="btn ghost logout hidden" title="Log out">Log out</button>
        </div>
      </header>

      <nav class="breadcrumbs" id="breadcrumbs"></nav>

      <main id="drop-zone" class="content">
        <div id="listing" class="listing"></div>
        <div id="empty" class="empty hidden">
          <div class="empty-ico">🗂️</div>
          <p>This folder is empty.</p>
          <p class="muted">Drop files here or use the Upload button.</p>
        </div>
        <div id="loading" class="loading hidden"><div class="spinner"></div></div>
        <div id="error-banner" class="error-banner hidden"></div>
        <div id="drop-overlay" class="drop-overlay hidden"><div>Drop to upload</div></div>
      </main>
    </div>

    <!-- Upload progress toast -->
    <div id="upload-toast" class="toast hidden">
      <div class="toast-title" id="upload-toast-title">Uploading…</div>
      <div class="progress"><div class="progress-bar" id="upload-progress-bar"></div></div>
    </div>

    <!-- Image / media preview -->
    <div id="viewer" class="viewer hidden">
      <div class="viewer-bar">
        <span class="viewer-name" id="viewer-name"></span>
        <div class="viewer-actions">
          <a id="viewer-download" class="btn ghost" download>Download</a>
          <button id="viewer-close" class="btn ghost">✕</button>
        </div>
      </div>
      <div class="viewer-body" id="viewer-body"></div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
